<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Drop Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#142d3b;font:15px system-ui}header{background:#082331;color:white;padding:22px 5%;font-size:23px;font-weight:bold}header span{color:#b9ef37}main{max-width:1200px;margin:auto;padding:28px 20px}section{background:white;border:1px solid #dce5e9;border-radius:12px;padding:24px;margin-bottom:16px}#login{max-width:440px;margin:40px auto}label{display:block;margin:14px 0}input,button{font:inherit;padding:12px;border:1px solid #b7c8d0;border-radius:7px}input{width:100%}button{background:#082331;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}td,th{padding:12px;border-bottom:1px solid #e3eaed}.scroll{overflow:auto}[hidden]{display:none!important}#message{white-space:pre-wrap}button:focus-visible,input:focus-visible{outline:3px solid #6b9b00}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:20px 0}.kpi{padding:18px;background:#f3f6f8;border:1px solid #dce5e9;border-radius:10px}.kpi strong{display:block;font-size:26px;margin-top:8px}.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.filters label{flex:1;min-width:160px;margin:0}select{width:100%;padding:12px;border:1px solid #b7c8d0;border-radius:7px;background:white;font:inherit}dialog{border:1px solid #dce5e9;border-radius:12px;max-width:90vw;overflow-wrap:anywhere;padding:24px}dialog::backdrop{background:#08233188}</style></head><body><header>DROP<span> ADMIN</span></header><main><p id="message" role="status" aria-live="polite">Sprawdzanie konfiguracji…</p><section id="login" hidden><h1>Logowanie administratora</h1><form id="form"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Hasło<input id="password" type="password" autocomplete="current-password" required></label><button id="submit">Zaloguj</button></form></section><section id="panel" hidden><h1>Centrum sprzedaży</h1><p>Środowisko testowe · ostatnie 100 zamówień · KPI uwzględniają filtry</p><div class="kpis"><div class="kpi">Zamówienia<strong id="kpiCount">0</strong></div><div class="kpi">Wartość bez anulowanych<strong id="kpiValue">0 zł</strong></div><div class="kpi">Opłacone bez anulowanych<strong id="kpiPaid">0 zł</strong></div><div class="kpi">Nowe<strong id="kpiNew">0</strong></div></div><div class="filters"><label>Sklep<select id="storeFilter"><option value="">Wszystkie</option><option value="cleanpro">CleanPro</option><option value="gardenpro">GardenPro</option></select></label><label>Realizacja<select id="statusFilter"><option value="">Wszystkie</option><option value="new">Nowe</option><option value="processing">W realizacji</option><option value="shipped">Wysłane</option><option value="delivered">Dostarczone</option><option value="cancelled">Anulowane</option></select></label><label>Numer zamówienia<input id="searchOrder" type="search" placeholder="Wyszukaj numer"></label></div><h2>Zamówienia</h2><button id="refresh">Odśwież</button> <button id="logout">Wyloguj</button><p id="summary"></p><div class="scroll"><table><thead><tr><th>Numer</th><th>Sklep</th><th>Data</th><th>Wartość</th><th>Płatność</th><th>Realizacja</th><th>Akcje</th></tr></thead><tbody id="rows"></tbody></table></div></section><dialog id="details"><h2 id="detailTitle"></h2><div id="detailItems"></div><button id="closeDetails">Zamknij</button></dialog></main><script src="drop-admin-config.js"></script><script src="drop-admin.js"></script></body></html>
