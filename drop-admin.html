<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Drop Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#142d3b;font:15px system-ui}header{background:#082331;color:white;padding:22px 5%;font-size:23px;font-weight:bold}header span{color:#b9ef37}main{max-width:1200px;margin:auto;padding:28px 20px}section{background:white;border:1px solid #dce5e9;border-radius:12px;padding:24px;margin-bottom:16px}#login{max-width:440px;margin:40px auto}label{display:block;margin:14px 0}input,button{font:inherit;padding:12px;border:1px solid #b7c8d0;border-radius:7px}input{width:100%}button{background:#082331;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}td,th{padding:12px;border-bottom:1px solid #e3eaed}.scroll{overflow:auto}[hidden]{display:none!important}#message{white-space:pre-wrap}button:focus-visible,input:focus-visible{outline:3px solid #6b9b00}</style></head><body><header>DROP<span> ADMIN</span></header><main><p id="message" role="status" aria-live="polite">Sprawdzanie konfiguracji…</p><section id="login" hidden><h1>Logowanie administratora</h1><form id="form"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Hasło<input id="password" type="password" autocomplete="current-password" required></label><button id="submit">Zaloguj</button></form></section><section id="panel" hidden><h1>Zamówienia</h1><button id="refresh">Odśwież</button> <button id="logout">Wyloguj</button><p id="summary"></p><div class="scroll"><table><thead><tr><th>Numer</th><th>Sklep</th><th>Data</th><th>Wartość</th><th>Płatność</th><th>Realizacja</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="drop-admin-config.js"></script><script src="drop-admin.js"></script></body></html>
